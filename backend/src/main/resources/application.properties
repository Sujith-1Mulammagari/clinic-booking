app.timezone=Asia/Kolkata
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/clinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:clinic}
